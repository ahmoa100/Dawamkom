<!doctype html>
<html lang="ar" dir="rtl">
<head><script src="/theme.js"></script>
  <script>try { if (new URLSearchParams(location.search).get('signed-out') === '1') { localStorage.removeItem('dawamkom-remembered-workspace'); } else if (/^\/company\/[a-f0-9-]{36}\/(employee)?$/.test(localStorage.getItem('dawamkom-remembered-workspace') || '')) { document.documentElement.classList.add('session-restoring'); const destination=localStorage.getItem('dawamkom-remembered-workspace'); if (/^\/company\/[a-f0-9-]{36}\/employee$/.test(destination)) location.replace(destination); } } catch {}</script>
  <style>.session-restoring #workspace-search,.session-restoring #workspace-forgot,.session-restoring #search-results{display:none}.session-loading{display:none}.session-restoring .session-loading{display:block}</style>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/dawamkom.webmanifest">
  <meta name="apple-mobile-web-app-title" content="دوامكم">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#103c45">
  <title>تسجيل الدخول | دوامكم</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css">
  <script type="module" src="/workspace-login.js"></script>
</head>
<body class="workspace-login">
  <header class="workspace-login-header">
    <button id="login-language" type="button" lang="en">◎ EN</button>
  </header>
  <main class="workspace-login-main">
    <div class="workspace-login-brand">
      <span class="mark" aria-hidden="true"></span>
      <h1 id="login-brand">دوامكم</h1>
    </div>
    <p class="session-loading" role="status">جارٍ فتح حسابك… / Opening your account…</p>
    <form id="workspace-search">
      <label><span id="search-label">تسجيل الدخول بالبريد الإلكتروني</span>
        <input id="search-input" type="email" autocomplete="email" maxlength="254" placeholder="example@gmail.com" required>
      </label>
      <button id="search-submit" class="button primary" type="submit">متابعة</button>
    </form>
    <p id="search-status" role="status"></p>
    <div id="search-results"></div>
    <p><a href="/forgot-password" id="workspace-forgot">نسيت كلمة المرور؟</a></p>
    <p class="hint"><a href="/support">الدعم / Support</a> · <a href="/privacy">سياسة الخصوصية / Privacy</a></p>
  </main>
</body>
</html>
