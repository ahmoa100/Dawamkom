<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c45">
  <title>تسجيل الدخول | دوامكم</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/workspace-login.js"></script>
</head>
<body class="workspace-login">
  <header class="workspace-login-header">
    <button id="login-language" type="button" lang="en">◎ EN</button>
  </header>
  <main class="workspace-login-main">
    <div class="workspace-login-brand">
      <span class="mark" aria-hidden="true"></span>
      <h1 id="login-brand">دوامكم</h1>
    </div>
    <form id="workspace-search">
      <label><span id="search-label">تسجيل الدخول بالبريد الإلكتروني</span>
        <input id="search-input" type="email" autocomplete="email" maxlength="254" placeholder="example@gmail.com" required>
      </label>
      <button id="search-submit" class="button primary" type="submit">متابعة</button>
    </form>
    <p id="search-status" role="status"></p>
    <div id="search-results"></div>
  </main>
</body>
</html>
