<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c45">
  <title>dawamkom</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('dawamkom-theme') || ''; } catch {}</script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#home" class="brand"><span class="mark" aria-hidden="true"></span><span id="brand-name">dawamkom</span></a>
    <div class="workspace"><span class="workspace-icon">▦</span><span id="company">Workspace</span></div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="sidebar-foot"><span class="dot"></span> <span id="demo-label">Local demo</span></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span id="crumb">Workspace</span><div class="actions">
      <button id="theme" class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
        <span class="theme-light" aria-hidden="true">Light</span>
        <span class="theme-track" aria-hidden="true"></span>
        <span class="theme-dark" aria-hidden="true">Dark</span>
      </button>
      <button id="language" class="button secondary" lang="ar">العربية</button><button id="switch" class="button secondary">Staff view</button>
    </div><form id="logout-form" method="post" hidden><button id="logout-button" class="button secondary" type="submit">تسجيل الخروج</button></form></header>
    <main id="main" aria-busy="true"><p>Loading dawamkom…</p></main>
  </div>
  <div id="message" role="status" class="toast" hidden></div>
</body>
</html>
