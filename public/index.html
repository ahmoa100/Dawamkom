<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="دوامكم">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c45">
  <title>dawamkom</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#home" class="brand"><span class="mark" aria-hidden="true"></span><span id="brand-name">dawamkom</span></a>
    <div class="workspace"><span class="workspace-icon">▦</span><span id="company">Workspace</span></div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="sidebar-foot"><span class="dot"></span> <span id="demo-label">Local demo</span></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span id="crumb">Workspace</span><div class="actions">
      <button id="language" class="button secondary" lang="ar">العربية</button><button id="switch" class="button secondary">Employee</button>
    </div><div class="management-topbar-actions"><button id="management-notifications" class="button secondary" type="button" aria-label="التنبيهات" aria-haspopup="dialog" hidden><span class="employee-bell" aria-hidden="true"></span><span id="management-notification-count" hidden></span></button><form id="logout-form" method="post" hidden><button id="logout-button" class="button secondary" type="submit">تسجيل الخروج</button></form></div></header>
    <main id="main" aria-busy="true"><p>Loading dawamkom…</p></main>
  </div>
  <div id="message" role="status" class="toast" hidden></div>
  <dialog id="request-rejection-dialog" class="catalog-dialog" aria-labelledby="request-rejection-title"><form id="request-rejection-form"><header><h2 id="request-rejection-title">ملاحظات الرفض</h2><button type="button" id="close-request-rejection" class="button secondary" aria-label="إغلاق">×</button></header><label id="request-rejection-label">ملاحظات الرفض<textarea name="rejectionNote" maxlength="2000" rows="4"></textarea></label><button type="submit" id="confirm-request-rejection" class="button primary">رفض الطلب</button><p id="request-rejection-error" role="alert"></p></form></dialog>
  <dialog id="management-notification-dialog" class="catalog-dialog" aria-labelledby="management-notification-title"><header><h2 id="management-notification-title">التنبيهات</h2><button type="button" id="close-management-notifications" class="button secondary" aria-label="إغلاق">×</button></header><div id="management-notification-list"></div></dialog>
</body>
</html>
