<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head><script src="/theme.js"></script>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="دوامكم">
  <meta charset="utf-8">
  <meta name="dawamkom-release" content="__DAWAMKOM_RELEASE__">
  <script type="module" src="/update-notice.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c45">
  <title>dawamkom</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#home" class="brand"><span class="mark" aria-hidden="true"></span><span id="brand-name">dawamkom</span></a>
    <div class="workspace"><span class="workspace-icon">▦</span><span id="company">Workspace</span></div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="sidebar-foot"><span class="dot"></span> <span id="demo-label">Local demo</span></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span id="crumb">Workspace</span><div class="actions"><button id="language" class="button secondary" lang="ar">English</button>
    </div><div class="management-topbar-actions"><button id="management-notifications" class="button secondary" type="button" aria-label="التنبيهات" aria-controls="management-notification-dialog" aria-expanded="false" hidden><span class="employee-bell" aria-hidden="true"></span><span id="management-notification-count" hidden></span></button><details id="account-menu" class="account-menu" hidden><summary><span class="account-avatar" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="4"/><path d="M3 22v-3a9 9 0 0 1 18 0v3z"/></svg></span><span class="account-identity"><strong id="account-name"></strong><bdi id="account-email"></bdi></span><span aria-hidden="true">⌄</span></summary><div class="account-dropdown"><a id="account-profile-link" href="#account">عرض الملف الشخصي <span aria-hidden="true">♙</span></a><div id="account-language-slot"></div><a id="account-password-link" href="#account/password">تغيير كلمة المرور <span aria-hidden="true">⚿</span></a><form id="logout-form" method="post" hidden><button id="logout-button" class="button secondary" type="submit">تسجيل الخروج</button></form></div></details></div></header>
    <main id="main" aria-busy="true"><p>Loading dawamkom…</p></main>
  </div>
  <div id="message" role="status" class="toast" hidden></div>
  <dialog id="request-rejection-dialog" class="catalog-dialog" aria-labelledby="request-rejection-title"><form id="request-rejection-form"><header><h2 id="request-rejection-title">ملاحظات الرفض</h2><button type="button" id="close-request-rejection" class="button secondary" aria-label="إغلاق">×</button></header><label id="request-rejection-label">ملاحظات الرفض<textarea name="rejectionNote" maxlength="2000" rows="4"></textarea></label><button type="submit" id="confirm-request-rejection" class="button primary">رفض الطلب</button><p id="request-rejection-error" role="alert"></p></form></dialog>
  <section id="management-notification-dialog" class="management-notification-popup" role="region" hidden aria-labelledby="management-notification-title"><header><h2 id="management-notification-title">التنبيهات</h2><button type="button" id="close-management-notifications" class="button secondary" aria-label="إغلاق">×</button></header><div id="management-notification-list" aria-live="polite"></div></section>
</body>
</html>
