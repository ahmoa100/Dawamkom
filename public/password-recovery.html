<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#14282e"><meta name="color-scheme" content="dark"><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><script type="module" src="/password-recovery.js"></script><title>استعادة كلمة المرور | دوامكم</title></head>
<body class="workspace-login"><header class="workspace-login-header"><button id="recovery-language" type="button">English</button></header><main class="workspace-login-main preview-access"><div class="workspace-login-brand"><span class="mark" aria-hidden="true"></span><strong>دوامكم</strong></div><h1 id="recovery-title">نسيت كلمة المرور؟</h1><p class="hint" id="recovery-intro">أدخل بريدك الإلكتروني لنرسل لك رابط إعادة تعيين كلمة المرور.</p>
<form id="recovery-request"><label><span id="recovery-email-label">البريد الإلكتروني</span><input name="email" type="email" autocomplete="email" maxlength="254" dir="ltr" required></label><button class="button primary" id="recovery-send">إرسال رابط الاستعادة</button></form>
<form id="recovery-reset" hidden><label><span id="recovery-password-label">كلمة المرور الجديدة</span><input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required aria-describedby="recovery-rules"></label><p id="recovery-rules" class="hint">من 10 إلى 128 حرفًا، مع حرف إنجليزي كبير وصغير ورقم ورمز.</p><label><span id="recovery-confirm-label">تأكيد كلمة المرور</span><input name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button class="button primary" id="recovery-save">حفظ كلمة المرور</button></form>
<p id="recovery-status" role="status" aria-live="polite"></p><p><a id="recovery-new" href="/forgot-password" hidden>طلب رابط جديد</a></p><p><a id="recovery-back" href="/">العودة إلى تسجيل الدخول</a></p></main></body></html>
